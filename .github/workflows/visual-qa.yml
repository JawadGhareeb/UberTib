name: V5 Visual QA

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x

      - name: Install app dependencies
        run: npm install

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Expo web
        run: |
          CI=1 EXPO_NO_TELEMETRY=1 npx expo start --web --port 8081 > /tmp/upertib-expo-web.log 2>&1 &
          echo $! > /tmp/upertib-expo-web.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/upertib-expo-web.log
          exit 1

      - name: Run visual QA at 360 / 390 / 430
        run: node scripts/visual-qa.mjs

      - name: Show Expo log on failure
        if: failure()
        run: cat /tmp/upertib-expo-web.log || true

      - name: Upload visual QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-visual-qa
          path: artifacts/visual-qa
          retention-days: 14
